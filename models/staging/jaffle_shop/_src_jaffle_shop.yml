version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: a clone of a postgres application database
    tables:
      - name: customers
        description: raw customer data 
        columns:
          - name: id
            description: primary key for customer data 
            tests:
              - unique
              - not_null

      - name: orders
        description: raw orders data
        columns:
          - name: id
            description: primary key for order data
            tests:
              - unique
              - not_null
